<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1536, height=2048" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="loader.css" />
  </head>
  <body>
    <!-- Cortag loading screen — tablet (1536x2048). Look and motion live in loader.css / loader.js. -->
    <div
      id="root"
      data-composition-id="tablet"
      data-start="0"
      data-duration="4"
      data-width="1536"
      data-height="2048"
    >
      <div id="stage" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div id="logo-wrap">
          <img id="logo" src="icon-512.png" alt="Cortag Revolution Tools" />
          <div id="blade"></div>
        </div>
        <div id="loader">
          <div id="bar"><div id="fill"></div></div>
          <div id="label">Carregando</div>
        </div>
      </div>
    </div>
    <script src="loader.js"></script>
    <script>
      const tl = window.buildCortagLoader();
      window.__timelines = window.__timelines || {};
      window.__timelines["tablet"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
